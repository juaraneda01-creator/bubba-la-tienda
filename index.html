<head>

<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://bubba-la-tienda.netlify.app/logo.jpg">

<style id="css">:root{
  color-scheme:light;
  --bg:#c2f1fd; --blob1:#ebaee0; --blob2:#ac82eb;
  --surface:#ffffff; --surface-soft:#f8fdff; --glass:rgba(248,253,255,.94);
  --ink:#442478; --muted:#604e83; --line:#e6dbf8; --line-strong:#9d86d6;
  --cyan:#17b8f3; --pink-brand:#f04aae;
  --purple:#7d37d4; --purple-dark:#5b26a6; --purple-soft:#dcc8f7; --purple-tint:#f6effd;
  --pink:#c92a89; --pink-btn:#d02f90; --pink-dark:#97205f; --pink-tint:#fff0fa;
  --yellow:#fef3a9; --yellow-ink:#4a3b00;
  --qh-a:#f36bc3; --qh-b:#bc65e2; --qh-ink:#2c1160;
  --green:#0f7a43; --green-ink:#ffffff;
  --shadow:0 10px 28px rgba(125,55,212,.12);
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
}



*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{
  margin:0; min-height:100vh; background-color:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.45;
  background-image:none;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple); outline-offset:2px}



.wrap{max-width:1180px; margin:0 auto; padding:20px 20px 40px}

/* ---------- Header ---------- */
.hdr{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  background:var(--glass); border:1.5px solid var(--line); border-radius:28px;
  padding:14px 22px 14px 14px; box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:14px}
.brand img{width:64px; height:64px; border-radius:18px; display:block; box-shadow:0 5px 0 var(--purple-dark)}
.brand h1{margin:0; font-family:var(--font-display); font-weight:600; font-size:28px; line-height:1.1}
.brand p{margin:2px 0 0; color:var(--pink); font-weight:800; font-size:14px}
.cta{
  display:inline-flex; align-items:center; gap:8px; border:1.5px solid #e9cd63; background:var(--yellow);
  color:var(--yellow-ink); font-weight:800; border-radius:999px; padding:10px 18px;
}
.cta:hover{filter:brightness(.97)}

/* ---------- Hero ---------- */
.hero{padding:34px 4px 18px}
.hero h2{
  margin:0 0 10px; font-family:var(--font-display); font-weight:600;
  font-size:clamp(28px,4.4vw,46px); line-height:1.08; max-width:24ch; text-wrap:balance;
}
.hero p{margin:0; color:var(--muted); max-width:46ch; font-size:17px}

/* ---------- Tabs ---------- */
.tabs{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 22px}
.tab{
  background:var(--surface); border:1.5px solid var(--purple-soft); color:var(--purple);
  border-radius:999px; padding:8px 18px; font-weight:800; font-size:14px;
}


.tab:hover{background:var(--purple-tint)}
.tab[aria-pressed="true"]{
  background:var(--purple); border-color:var(--purple); color:#fff; box-shadow:0 5px 0 var(--purple-dark);
}

/* ---------- Layout ---------- */
.layout{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr); gap:24px; align-items:start}
.panel{background:var(--surface); border:1.5px solid var(--line); border-radius:28px; box-shadow:var(--shadow)}
.products{padding:22px}
.products-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:14px}
.products-top h3{margin:0; font-family:var(--font-display); font-weight:600; font-size:20px}
.products-top span{color:var(--muted); font-weight:700; font-size:14px}
.search{display:flex; gap:10px; margin-bottom:16px}
.search input{
  flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface-soft);
  border-radius:14px; padding:11px 14px;
}
.search input::placeholder{color:var(--muted); opacity:.8}
.btn-dark{
  background:var(--purple); color:#fff; border:0; border-radius:12px; padding:10px 20px; font-weight:800;
  box-shadow:0 4px 0 var(--purple-dark);
}
.btn-dark:active{transform:translateY(2px); box-shadow:0 2px 0 var(--purple-dark)}

.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.card{
  display:grid; grid-template-columns:84px minmax(0,1fr); grid-template-areas:"thumb info" "thumb step";
  column-gap:14px; row-gap:6px; padding:14px; background:var(--surface);
  border:1.5px solid var(--line); border-radius:20px; transition:border-color .15s, background-color .15s;
}
.card.sel{border-color:var(--purple); background:var(--purple-tint)}
.thumb{
  grid-area:thumb; width:84px; height:84px; border-radius:20px; display:grid; place-items:center;
  font-size:40px; overflow:hidden;
  background:linear-gradient(145deg,var(--t1),var(--t2));
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.info{grid-area:info; min-width:0}
.info h4{margin:0; font-size:15px; font-weight:800; line-height:1.25}
.price{margin:3px 0 0; font-family:var(--font-display); font-weight:600; font-size:19px; color:var(--pink)}
.step{grid-area:step; display:flex; align-items:center; justify-content:flex-end; gap:12px}
.step output{min-width:22px; text-align:center; font-weight:800}
.qb{
  width:38px; height:38px; border-radius:11px; border:0; font-size:20px; font-weight:800; line-height:1;
  display:grid; place-items:center;
}
.qb.minus{background:var(--purple-soft); color:var(--purple-dark)}


.qb.plus{background:var(--purple); color:#fff}
.qb:disabled{opacity:.45; cursor:not-allowed}
.no-results{margin:20px 0 6px; text-align:center; color:var(--muted); font-weight:700}

/* tile palettes per category */
[data-c="0"]{--t1:#ffe6f8; --t2:#f7a8e6}
[data-c="1"]{--t1:#fff8c4; --t2:#f8e46a}
[data-c="2"]{--t1:#dcf6fe; --t2:#8ddcf7}
[data-c="3"]{--t1:#ffdaf1; --t2:#f78bd4}
[data-c="4"]{--t1:#f1e4fd; --t2:#c8a2f3}
[data-c="5"]{--t1:#dfe4ff; --t2:#a5b2f7}
[data-c="6"]{--t1:#fff4cf; --t2:#ffd07a}
[data-c="7"]{--t1:#d5f7ff; --t2:#6fd3f5}

/* ---------- Quote ---------- */
.quote{position:sticky; top:16px; overflow:hidden; max-height:calc(100vh - 32px); overflow-y:auto}
.q-head{padding:18px 22px; color:var(--qh-ink); background:linear-gradient(120deg,var(--qh-a),var(--qh-b))}
.q-head h3{margin:0; font-family:var(--font-display); font-weight:600; font-size:21px}
.q-head p{margin:2px 0 0; font-size:14px; font-weight:600; opacity:.95}
.q-body{padding:18px 22px}
.empty{text-align:center; padding:14px 0 18px; color:var(--muted); font-weight:700}
.empty svg{display:block; margin:0 auto 10px; color:var(--muted)}
.empty small{display:block; font-weight:600; margin-top:2px}
.lines{list-style:none; margin:0 0 14px; padding:0; display:grid; gap:8px}
.line{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center; font-size:14px}
.lq{font-weight:800; color:var(--purple)}


.ln{min-width:0}
.lp{font-weight:800}
.lx{width:28px; height:28px; border-radius:8px; border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1}
.lx:hover{background:var(--pink-tint); color:var(--pink)}

.sect{border-top:1.5px solid var(--line); padding-top:16px; margin-top:16px}
.sect h4{margin:0 0 10px; font-size:16px; font-weight:800}
.row{display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px; align-items:center; margin-bottom:10px}
.row label{font-size:13px; font-weight:800; color:var(--muted)}
.field{
  width:100%; border:1.5px solid var(--line); background:var(--surface-soft); border-radius:12px; padding:9px 12px; min-width:0;
}
textarea.field{resize:vertical; min-height:70px}
.stack label{display:block; font-size:13px; font-weight:800; color:var(--muted); margin:0 0 4px}
.stack .field{margin-bottom:12px}
.btn-pink{
  width:100%; border:0; border-radius:12px; padding:11px; font-weight:800; color:#fff; background:var(--pink-btn);
  box-shadow:0 4px 0 var(--pink-dark);
}
.btn-pink:active{transform:translateY(2px); box-shadow:0 2px 0 var(--pink-dark)}
.dmsg{min-height:20px; margin:8px 0 0; font-size:13px; font-weight:700; color:var(--muted)}
.chip{
  display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--pink-tint);
  border-radius:12px; padding:8px 12px; font-size:14px; font-weight:800; margin-top:10px;
}
.chip button{border:0; background:transparent; color:var(--pink); font-weight:800; text-decoration:underline; padding:2px}

.totals{display:grid; gap:6px; font-size:15px}
.totals div{display:flex; justify-content:space-between}
.totals .disc{color:var(--pink); font-weight:800}
.totals .grand{
  margin-top:6px; padding-top:10px; border-top:1.5px dashed var(--line);
  font-family:var(--font-display); font-weight:600; font-size:26px;
}
.totals .grand span:last-child{color:var(--purple)}


.fine{margin:10px 0 0; font-size:12.5px; color:var(--muted)}

.actions{display:grid; gap:10px; margin-top:16px}
.wa{
  display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  background:var(--green); color:var(--green-ink); font-weight:800; border-radius:14px; padding:14px 16px;
  box-shadow:0 4px 0 #0a5730; text-align:center;
}
.wa[aria-disabled="true"]{opacity:.5; pointer-events:none; box-shadow:none}
.secondary{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn-ghost{
  background:var(--surface); border:1.5px solid var(--purple-soft); color:var(--purple); border-radius:12px;
  padding:10px; font-weight:800;
}


.btn-ghost:hover{background:var(--purple-tint)}

.foot{margin:28px 4px 0; color:var(--muted); font-size:13.5px; text-align:center}

/* mobile bar + toast */
.mbar{
  display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:20; gap:12px; align-items:center;
  justify-content:space-between; background:var(--purple); color:#fff; border-radius:18px; padding:10px 10px 10px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.mbar strong{display:block; font-family:var(--font-display); font-size:20px; line-height:1.1}
.mbar span{font-size:12.5px; opacity:.95}
.mbar button{border:0; border-radius:12px; padding:11px 16px; font-weight:800; background:var(--yellow); color:var(--yellow-ink)}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--bg);
  padding:10px 18px; border-radius:999px; font-weight:800; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.on{opacity:1}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .quote{position:static; max-height:none}
  .mbar.show{display:flex}
  .wrap{padding-bottom:110px}
}
@media (max-width:560px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .wrap{padding:14px 14px 110px}
  .hdr{padding:12px}
  .brand h1{font-size:23px}
  .brand img{width:54px; height:54px}
  .products{padding:16px}
  .toast{bottom:96px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important; scroll-behavior:auto !important}}

[hidden]{display:none !important}
/* ---------- v2: barra dueña, vistas, panel ---------- */
.obar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; padding:9px 14px; border-radius:16px; background:var(--purple); color:#fff; font-weight:800; font-size:14px}
.obar .sp{flex:1}
.obar button{border:0; border-radius:10px; padding:7px 14px; font-weight:800; background:var(--yellow); color:var(--yellow-ink)}
.obar .dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:#ffd24a; margin-right:6px}
.vswitch{display:inline-flex; gap:6px; padding:5px; border-radius:999px; background:var(--glass); border:1.5px solid var(--line); margin:0 0 16px}
.vswitch button{border:0; background:transparent; color:var(--muted); font-weight:800; border-radius:999px; padding:9px 18px}
.vswitch button[aria-pressed="true"]{background:var(--pink); color:#fff}
.badge{position:absolute; top:8px; right:8px; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--yellow); color:var(--yellow-ink)}
.badge.out{background:#5b4a99; color:#fff}
.card{position:relative}
.card.oos{opacity:.62}
.hint{margin:0 0 12px; padding:9px 12px; border-radius:12px; background:var(--pink-tint); font-size:13.5px; font-weight:700}
.hint.ok{background:#d9f7e6; color:#0b5a31}


.btn-sale{width:100%; border:0; border-radius:14px; padding:13px; font-weight:800; color:#fff; background:var(--purple); box-shadow:0 4px 0 var(--purple-dark)}
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 16px}
.ptabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px}
.ptabs .tab{padding:8px 16px}
.pane{padding:22px}
.pane h3{margin:0 0 4px; font-family:var(--font-display); font-weight:600; font-size:22px}
.pane .sub{margin:0 0 16px; color:var(--muted); font-size:14px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:0 0 18px}
.stat{background:var(--surface-soft); border:1.5px solid var(--line); border-radius:18px; padding:14px 16px}
.stat b{display:block; font-family:var(--font-display); font-weight:600; font-size:24px; line-height:1.15}
.stat span{font-size:13px; color:var(--muted); font-weight:700}
.stat.pos b{color:#0f7a43} .stat.neg b{color:var(--pink)}


.split{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px}
.box{border:1.5px solid var(--line); border-radius:18px; padding:16px; background:var(--surface-soft)}
.box h4{margin:0 0 10px; font-size:15px; font-weight:800}
.tbl-wrap{overflow-x:auto; border:1.5px solid var(--line); border-radius:16px}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-size:12.5px; color:var(--muted); font-weight:800; background:var(--surface-soft); white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td input.cell,td select.cell{width:100%; min-width:70px; border:1.5px solid var(--line); background:var(--surface-soft); border-radius:9px; padding:6px 8px}
td input.cell.name{min-width:200px}
td input.cell.n{max-width:96px; text-align:right}
td input[type="checkbox"]{width:18px; height:18px}
.chipx{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:800; background:var(--purple-tint); color:var(--purple)}
.chipx.ok{background:#d9f7e6; color:#0b5a31} .chipx.warn{background:#fff0c2; color:#6a4a00} .chipx.bad{background:var(--pink-tint); color:var(--pink)}

.mini{border:1.5px solid var(--purple-soft); background:var(--surface); color:var(--purple); border-radius:9px; padding:5px 10px; font-weight:800; font-size:13px}


.mini.danger{color:var(--pink); border-color:var(--pink-tint)}
.frm{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; align-items:end; margin:0 0 14px}
.frm label{display:block; font-size:13px; font-weight:800; color:var(--muted); margin:0 0 4px}
.lock{max-width:460px; margin:10px auto; text-align:center}
.lock p{color:var(--muted)}
.lock .field{margin:8px 0}
.note{font-size:13px; color:var(--muted); margin:8px 0 0}
.up{border:2px dashed var(--purple-soft); border-radius:18px; padding:16px; background:var(--surface-soft); margin:0 0 16px}
.up h4{margin:0 0 6px}
.bars{display:flex; align-items:flex-end; gap:6px; height:130px; padding:6px 0 0}
.bars div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0}
.bars i{display:block; width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,var(--pink),var(--purple)); min-height:2px}
.bars small{font-size:10.5px; color:var(--muted); margin-top:4px}
.ov{position:fixed; inset:0; z-index:50; background:rgba(20,8,50,.55); display:grid; place-items:center; padding:14px}
.dlg{width:min(560px,100%); max-height:92vh; overflow:auto; background:var(--surface); border-radius:24px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 12px; font-family:var(--font-display); font-weight:600; font-size:22px}
.dlg .acts{display:flex; gap:10px; margin-top:16px}
.dlg .acts>*{flex:1}
.radios{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px}
.radios label{display:flex; align-items:center; gap:6px; margin:0; padding:7px 12px; border:1.5px solid var(--line); border-radius:999px; font-size:13.5px; color:var(--ink); cursor:pointer}
.radios input:checked + span{font-weight:800}
.tot2{margin:12px 0 0; padding:12px; border-radius:14px; background:var(--purple-tint); display:grid; gap:4px}
.tot2 div{display:flex; justify-content:space-between}
.tot2 .g{font-family:var(--font-display); font-size:22px; font-weight:600}
.prev td.ok{color:#0b5a31; font-weight:800} .prev td.no{color:var(--pink); font-weight:800}
@media (max-width:560px){ .pane{padding:14px} .obar{font-size:13px} }

.card:has(.badge) .info h4{padding-right:74px}
td.num{white-space:nowrap}

.mayor{margin:2px 0 0; font-size:12px; font-weight:800; color:#0f7a43}


.card:has(.mayor) .step{align-self:end}

.frm.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split.sim{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (max-width:560px){.frm.c2{grid-template-columns:minmax(0,1fr)}}

/* ---------- fondo liso ---------- */
#app{position:relative}
.wrap{position:relative; z-index:1}
.hdr{background:var(--glass); border:1.5px solid var(--line)}
/* ---------- fotos, backlog ---------- */
.pth{width:46px; height:46px; border-radius:12px; display:inline-grid; place-items:center; overflow:hidden; background:var(--purple-tint); font-size:22px; vertical-align:middle; margin-right:6px}
.pth img{width:100%; height:100%; object-fit:cover; display:block}
.pth.lg{width:96px; height:96px; font-size:44px; border-radius:18px}
.pv{width:52px; height:52px; object-fit:cover; border-radius:10px; display:block}
td.foto{white-space:nowrap}
.mini.file{display:inline-block; cursor:pointer}
.mini.file input{display:none}
.archived td{opacity:.95}

.field,.search input,td input.cell,td select.cell{border-color:var(--line-strong)}
.price{color:var(--pink-btn)}
.cta{background:var(--yellow); border-color:#eed96a; color:var(--yellow-ink)}
.badge{background:var(--yellow); color:var(--yellow-ink)}
.brand p{color:var(--pink)}
.tab{border-color:var(--purple-soft)}
.vswitch button[aria-pressed="true"]{background:var(--purple); color:#fff; box-shadow:0 3px 0 var(--purple-dark)}

html{background:#c2f1fd}
body{background-color:#c2f1fd}
/* ---------- compartir link ---------- */
.hbtns{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.cta.ghost{background:var(--surface); border-color:var(--purple-soft); color:var(--purple)}
.cta.ghost:hover{background:var(--purple-tint)}
.linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.linkbox .field{flex:1; min-width:220px}
</style>
</head>

    if(c==='conflict') return false;                 // la página se recarga sola con la versión ganadora
    store('s','bl_toast',null);
    if(c==='not_writer'||c==='not_granted') toast('Solo la dueña puede publicar cambios.');
    else if(c==='rate_limited') toast('Demasiados cambios seguidos. Espera unos segundos e inténtalo de nuevo.');
    else if(c==='too_large') toast('La página es demasiado grande. Respalda y limpia ventas antiguas.');
    else toast('No se pudo publicar. Intenta de nuevo.');
    return false;
  }
}

function loadCart(){

}
const saveCart=()=>{ store('l','bl_cart',JSON.stringify(cart)); store('l','bl_meta',JSON.stringify(meta)); };
const maxQty=p=>p.s==null?99:Math.min(99,p.s);
function setQty(id,n){ const p=P(id); if(!p)return; n=clamp(n,0,maxQty(p)); if(n===0)delete cart[id]; else cart[id]=n; saveCart(); syncCard(id); renderQuote(); }
function price(ov){
  const ls=Object.keys(cart).map(id=>({p:P(id),q:cart[id]})).filter(l=>l.p);
  const c=cfg();
  let sub=0,units=0,best=0;
  ls.forEach(l=>{
    const t=l.p.p*l.q; sub+=t; units+=l.q; l.t=t;
    l.fijo=!!c.activo&&elig(l.p)&&l.p.wm==='fijo'&&l.p.pm>0&&l.q>=c.min;
    l.dsc=!!c.activo&&elig(l.p)&&l.p.wm!=='fijo'&&l.q>=c.min;
    if(l.fijo) l.fdif=Math.max(0,(l.p.p-l.p.pm)*l.q);
    if(elig(l.p)) best=Math.max(best,l.q);
  });
  const qualPct=ls.some(l=>l.dsc), qualFijo=ls.some(l=>l.fijo), qual=qualPct||qualFijo;
  const base=c.alcance==='todo'?ls.filter(l=>elig(l.p)&&l.p.wm!=='fijo'):ls.filter(l=>l.dsc);
  const autoPct=qualPct?Math.round(sum(base,l=>l.t)*c.pct/100):0;
  const autoFijo=Math.round(sum(ls.filter(l=>l.fijo),l=>l.fdif));
  const auto=autoPct+autoFijo;
  let d=auto,pct=qualPct?c.pct:0;
  let label=qualPct&&qualFijo?'Descuento por mayor':(qualFijo?'Precio mayorista':(qualPct?'Descuento por mayor ('+c.pct+'%)':''));
  if(ov){
    if(ov.mode==='none'){d=0;label='';pct=0;}
    else if(ov.mode==='pct'){pct=clamp(+ov.val||0,0,100);d=Math.round(sub*pct/100);label='Descuento ('+pct+'%)';}
    else if(ov.mode==='amt'){d=clamp(Math.round(+ov.val||0),0,sub);label='Descuento';pct=0;}
  }
  d=Math.min(d,sub);
  return {ls,sub,units,best,d,total:sub-d,label,pct,qual,auto,missing:Math.max(0,c.min-best)};
}
function waMessage(pr){
  let m='Hola Bubba L.A.! 🎈 Quiero cotizar un detallito sorpresa:\n\n';
  m+=pr.ls.map(l=>'• '+l.q+' × '+l.p.n+' — '+money(l.p.p*l.q)).join('\n')+'\n\n';
  m+='Subtotal: '+money(pr.sub)+'\n';
  if(pr.d>0) m+=pr.label+': −'+money(pr.d)+'\n';
  m+='Total estimado: '+money(pr.total);
  if(meta.name.trim()) m+='\n\nNombre: '+meta.name.trim();
  if(meta.notes.trim()) m+='\nComentarios: '+meta.notes.trim();
  return m;
}

  if(!L){ toast('Primero desbloquea tu libro de ventas en el panel.'); return; }
  const f=ui.sale, pr=price(saleOv(f)); if(!pr.ls.length)return;
  for(const l of pr.ls){ if(l.p.s!=null&&l.q>l.p.s){ toast('Stock insuficiente: '+l.p.n+' (quedan '+l.p.s+').'); return; } }

  const id=L.seq++, now=Date.now();
  L.ventas.push({id,ts:now,tipo:f.tipo,cliente:f.cliente.trim(),tel:f.tel.trim(),
    items:pr.ls.map(l=>({id:l.p.id,n:l.p.n,q:l.q,p:l.p.p,k:costOf(l.p.id)})),
    sub:pr.sub,d:pr.d,dl:pr.label,total:pr.total,

const saldo=v=>v.total-sum(v.pagos,x=>x.m);
function inPeriod(ts,per){
  if(per==='todo')return true; const now=new Date(), d=new Date(ts);
  if(per==='hoy')return dayKey(ts)===dayKey(Date.now());
  if(per==='7d'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6).getTime(); return ts>=s; }
  return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
}
const PERIODS=[['hoy','Hoy'],['7d','7 días'],['mes','Este mes'],['todo','Todo']];
function stats(per){
  const vs=L.ventas.filter(v=>v.estado==='ok'&&inPeriod(v.ts,per));
  const ventas=sum(vs,v=>v.total), desc=sum(vs,v=>v.d);
  let costo=0,sinCosto=0; vs.forEach(v=>v.items.forEach(i=>{ if(i.k!=null)costo+=i.k*i.q; else sinCosto+=i.q; }));
  const pagos=[]; L.ventas.forEach(v=>{ if(v.estado==='ok') v.pagos.forEach(pg=>{ if(inPeriod(pg.ts,per)) pagos.push(Object.assign({v},pg)); }); });
  const cobrado=sum(pagos,x=>x.m);
  const movs=L.movs.filter(m=>inPeriod(m.ts,per));
  const gastos=sum(movs.filter(m=>m.t==='gasto'),m=>m.m), otros=sum(movs.filter(m=>m.t==='ingreso'),m=>m.m);
  const porCobrar=sum(L.ventas.filter(v=>v.estado==='ok'),saldo);
  const top={}; vs.forEach(v=>v.items.forEach(i=>{ const t=top[i.n]||(top[i.n]={n:i.n,q:0,t:0}); t.q+=i.q; t.t+=i.p*i.q; }));
  const medios={}; pagos.forEach(x=>{ medios[x.medio]=(medios[x.medio]||0)+x.m; });
  return {vs,ventas,desc,costo,sinCosto,cobrado,gastos,otros,porCobrar,utilidad:ventas-costo-gastos,caja:cobrado+otros-gastos,
    top:Object.values(top).sort((a,b)=>b.t-a.t).slice(0,6),medios};
}

const SIM_DEF=()=>({fijos:[{c:'Arriendo o espacio de trabajo',m:0},{c:'Internet y celular',m:0},{c:'Publicidad y redes',m:0},{c:'Tu sueldo (tiempo dedicado)',m:0}],
  unid:100,comision:2,publi:0,merma:3,empaque:0,envio:0,iva:false,ivaPct:19,margen:40,margenMin:15,redondeo:'90',
  contado:70,plazo:1,crec:0,invPct:100,caja0:0,meses:6});
const pctf=x=>String(Math.round(x*1000)/10).replace('.',',')+'%';
function simTotals(){ const s=L.sim, fijos=sum(s.fijos,f=>+f.m||0); return {fijos,fu:s.unid>0?fijos/s.unid:0,v:((+s.comision||0)+(+s.publi||0))/100}; }
function roundPrice(x,mode){
  if(!isFinite(x)||x<=0) return null;
  if(mode==='0') return Math.round(x);
  if(mode==='90') return Math.max(90,Math.ceil((x-90)/100)*100+90);
  const st=+mode||10; return Math.ceil(x/st)*st;
}
function unitCalc(p,price){
  const s=L.sim,T=simTotals(),C=costOf(p.id); if(C==null||!(price>0)) return null;
  const net=s.iva?price/(1+s.ivaPct/100):price;
  const costo=C*(1+s.merma/100), extra=(+s.empaque||0)+(+s.envio||0), varp=net*T.v;
  const contrib=net-varp-costo-extra, util=contrib-T.fu;
  return {net,iva:price-net,costo,extra,varp,contrib,util,fu:T.fu,margen:net>0?util/net:0};
}
function priceFor(p,marginPct){
  const s=L.sim,T=simTotals(),C=costOf(p.id); if(C==null) return null;
  const den=1-T.v-marginPct/100; if(den<=0.01) return {err:true};
  const base=C*(1+s.merma/100)+(+s.empaque||0)+(+s.envio||0)+T.fu;
  const pn=base/den, pf=s.iva?pn*(1+s.ivaPct/100):pn;
  return {raw:pf,price:roundPrice(pf,s.redondeo),exact:Math.ceil(pf)};
}
const suggest=p=>priceFor(p,L.sim.margen);
function mix(){
  const s=L.sim, cutoff=Date.now()-90*864e5; let u=0,rev=0,cost=0;
  L.ventas.forEach(v=>{ if(v.estado!=='ok'||v.ts<cutoff)return; const f=v.sub>0?1-v.d/v.sub:1;
    v.items.forEach(i=>{ const c=i.k!=null?i.k:costOf(i.id); if(c!=null){ u+=i.q; rev+=i.q*i.p*f; cost+=i.q*c; } }); });
  if(u>=10) return {price:rev/u,cost:cost/u,src:'tus ventas de los últimos 90 días ('+u+' unidades)'};
  const ps=S.productos.filter(p=>p.v!==false&&costOf(p.id)!=null);
  if(!ps.length) return null;
  return {price:sum(ps,p=>p.p)/ps.length,cost:sum(ps,p=>costOf(p.id))/ps.length,src:'el promedio de '+ps.length+' productos con costo cargado (aún tienes pocas ventas registradas)'};
}
function flow(){
  const s=L.sim,T=simTotals(),m=mix(); if(!m) return null;
  const net=s.iva?m.price/(1+s.ivaPct/100):m.price, ucost=m.cost*(1+s.merma/100)+(+s.empaque||0)+(+s.envio||0);
  const rows=[], cred=[]; let saldo=+s.caja0||0; const n=clamp(parseInt(s.meses)||6,1,12);
  for(let i=0;i<n;i++){
    const u=s.unid*Math.pow(1+(+s.crec||0)/100,i), ventas=u*net, cogs=u*ucost, varc=ventas*T.v;
    const contado=ventas*(clamp(+s.contado||0,0,100))/100, cr=ventas-contado; cred.push(cr);
    const plazo=parseInt(s.plazo)||0;
    const cobros=plazo===0?ventas:contado+(i-plazo>=0?cred[i-plazo]:0);
    const compras=cogs*(+s.invPct||0)/100, flujo=cobros-compras-varc-T.fijos; saldo+=flujo;
    rows.push({m:i+1,u,ventas,cobros,compras,varc,fijos:T.fijos,flujo,saldo,util:ventas-cogs-varc-T.fijos});
  }
  const cm=net*(1-T.v)-ucost, be=cm>0?T.fijos/cm:null;
  return {rows,m,net,cm,be,beVentas:be==null?null:be*net};
}
function cashChart(rows){

  const k=v=>(Math.abs(v)>=1000?Math.round(v/1000)+'k':Math.round(v));

function readZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out=[];
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=TD.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+el+cl;
    if(name.endsWith('/')) continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    out.push({name,method,data:u8.subarray(start,start+csize)});
  }

}

    const base=e.name.split('/').pop();
    if(!IMG_EXT.test(base)||e.name.indexOf('__MACOSX')>-1||base[0]==='.') continue;
    let data=e.data; if(e.method===8) data=new Uint8Array(await inflateRaw(e.data)); else if(e.method!==0) continue;
    const ext=base.split('.').pop().toLowerCase().replace('jpg','jpeg');
    items.push({name:base,blob:new Blob([data],{type:'image/'+ext})});
  }
  return items;
}

function splitLine(line,d){ const out=[];let cur='',q=false; for(let i=0;i<line.length;i++){const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(!q&&line.startsWith(d,i)){out.push(cur);cur='';i+=d.length-1;} else cur+=ch;} out.push(cur); return out.map(s=>s.trim()); }
function parseText(txt){
  const lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  let best='\t',bc=-1; ['\t',';','|',',',' - ',':'].forEach(d=>{ const c=lines.filter(l=>splitLine(l,d).length>=2).length; if(c>bc){bc=c;best=d;} });
  return lines.map(l=>splitLine(l,best));
}
async function readFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    await loadXLSX(); const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(c=>String(c)));
  }
  const buf=await file.arrayBuffer(); let txt=TD.decode(buf); if(txt.includes('\ufffd')) txt=new TextDecoder('windows-1252').decode(buf);
  return parseText(txt);
}
function loadXLSX(){ return new Promise((res,rej)=>{ if(window.XLSX)return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('xlsx')); document.head.appendChild(s); }); }
const HN={n:['nombre','producto','articulo','item','descripcion','detalle'],p:['precio','valor','pvp','precio venta','precio de venta'],s:['stock','inventario','cantidad','existencias','existencia','unidades'],k:['costo','costo unitario','precio costo'],c:['categoria','rubro','linea','tipo'],m:['minimo','stock minimo','min','stock min']};
function dice(a,b){ if(a===b)return 1; if(a.length<2||b.length<2)return 0; const bg=s=>{const m={};for(let i=0;i<s.length-1;i++){const x=s.substr(i,2);m[x]=(m[x]||0)+1;}return m;}; const A=bg(a),B=bg(b); let o=0; Object.keys(A).forEach(k=>{ if(B[k])o+=Math.min(A[k],B[k]); }); return 2*o/(a.length+b.length-2); }
function matchProd(name){
  const n=norm(name); if(!n)return null;
  let m=S.productos.find(p=>norm(p.n)===n); if(m)return m;
  const c=S.productos.filter(p=>norm(p.n).includes(n)||n.includes(norm(p.n))); if(c.length===1)return c[0];
  let best=null,bs=0; S.productos.forEach(p=>{ const s=dice(n,norm(p.n)); if(s>bs){bs=s;best=p;} }); return bs>=0.86?best:null;
}
function interpret(rows){
  rows=rows.filter(r=>r.some(c=>String(c).trim())); if(!rows.length)return [];
  const h=rows[0].map(norm), idx={};
  Object.keys(HN).forEach(k=>{ const i=h.findIndex(x=>HN[k].includes(x)); if(i>-1)idx[k]=i; });
  let start=1;
  if(idx.n==null){ if(num(rows[0][1])!=null&&rows[0][1]!==''){ idx.n=0;idx.p=1;idx.s=2; start=0; } else { idx.n=0;idx.p=idx.p??1;idx.s=idx.s??2; } }
  return rows.slice(start).map(r=>{
    const name=String(r[idx.n]||'').trim(); if(!name)return null;
    const cn=idx.c!=null?norm(r[idx.c]):''; const cat=CATS.find(c=>norm(c)===cn)||null;
    return {name,prod:matchProd(name),p:idx.p!=null?num(r[idx.p]):null,s:idx.s!=null?num(r[idx.s]):null,k:idx.k!=null?num(r[idx.k]):null,m:idx.m!=null?num(r[idx.m]):null,c:cat};
  }).filter(Boolean);
}

  if(!keep&&armed){ armed=null; }
  switch(a){
    case 'view': setView(b.dataset.v); break;
    case 'goq': { const q=$('#quote'); if(q){ const r=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; q.scrollIntoView({behavior:r?'auto':'smooth',block:'start'}); $('#qTitle').focus({preventScroll:true}); } break; }
    case 'cat': ui.cat=b.dataset.c; $$('.tabs .tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.c===ui.cat))); renderList(); break;
    case 'clearq': ui.q=''; ui.cat='Todos'; $('#q').value=''; $$('.tabs .tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.c==='Todos'))); renderList(); $('#q').focus(); break;
    case 'inc': { const pid=b.closest('.card').dataset.id; setQty(pid,(cart[pid]||0)+1); break; }
    case 'dec': { const pid=b.closest('.card').dataset.id; setQty(pid,(cart[pid]||0)-1); break; }
    case 'rm': setQty(id,0); break;
    case 'resetcart': cart={}; saveCart(); renderList(); renderQuote(); break;
    case 'copy': { const pr=price(); if(!pr.ls.length){toast('Agrega productos para copiar tu cotización');break;} const t=waMessage(pr);
      const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}document.body.removeChild(ta);toast(ok?'Cotización copiada':'No se pudo copiar. Usa el botón de WhatsApp.');};
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast('Cotización copiada'),fb); else fb(); break; }
    case 'opensale': openSale(); break;
    case 'salecancel': ui.sale=null; renderModal(); break;
    case 'saleok': await confirmSale(); break;
    case 'ptab': ui.tab=b.dataset.t; armed=null; render(); break;
    case 'period': ui.period=b.dataset.p; renderPane(); $$('#pane .tools .tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.p===ui.period))); break;
    case 'openrow': ui.openSale=ui.openSale===+id?null:+id; renderPane(); break;
    case 'anular': { if(armed!=='anular'+id){armed='anular'+id;renderPane();break;} armed=null;
      const v=L.ventas.find(x=>x.id===+id); if(!v||v.estado!=='ok')break; v.estado='anulada';
      v.items.forEach(i=>{ const p=P(i.id); if(p&&p.s!=null)p.s+=i.q; }); await persist('Venta #'+id+' anulada. Stock devuelto al inventario.'); break; }
    case 'addmov': { const c=$('#mC').value.trim(), m=num($('#mM').value); if(!c||!m||m<=0){toast('Escribe un concepto y un monto válido.');break;}
      L.movs.push({id:L.mseq++,ts:Date.now(),t:$('#mT').value,c,m,cat:$('#mK').value}); await persist('Movimiento registrado.'); break; }
    case 'delmov': { if(armed!=='delmov'+id){armed='delmov'+id;renderPane();break;} armed=null; L.movs=L.movs.filter(x=>x.id!==+id); await persist('Movimiento eliminado.'); break; }
    case 'abono': { const v=L.ventas.find(x=>x.id===+id); const m=num($('#ab'+id).value); if(!v||!m||m<=0){toast('Ingresa un monto válido.');break;}
      v.pagos.push({ts:Date.now(),m:Math.min(m,saldo(v)),medio:$('#am'+id).value}); await persist('Pago registrado en la venta #'+id+'.'); break; }
    case 'dlventas': download('ventas-bubba-la.csv',csv([['N°','Fecha','Tipo','Cliente','WhatsApp','Productos','Subtotal','Descuento','Total','Pagado','Saldo','Estado']].concat(L.ventas.map(v=>[v.id,fdate(v.ts),v.tipo==='mayor'?'Mayor':'Detalle',v.cliente,v.tel,v.items.map(i=>i.q+' x '+i.n).join(' | '),v.sub,v.d,v.total,sum(v.pagos,x=>x.m),saldo(v),v.estado])))); break;
    case 'dlinv': download('inventario-bubba-la.csv',csv([['categoria','nombre','precio','costo','stock','minimo']].concat(S.productos.map(p=>[p.c,p.n,p.p,costOf(p.id)==null?'':costOf(p.id),p.s==null?'':p.s,p.m==null?'':p.m])))); break;
    case 'addprod': ui.prodM={img:null}; renderModal(); { const f=$('#pm_n'); if(f)f.focus(); } break;
    case 'prodcancel': ui.prodM=null; renderModal(); break;
    case 'prodsave': saveNewProduct(); break;
    case 'rmprod': ui.rmM={id}; renderModal(); break;
    case 'rmcancel': ui.rmM=null; renderModal(); break;
    case 'rmok': archiveProduct(); break;
    case 'restore': { const x=L&&L.archivo[+id]; if(!x)break; const p=x.p; if(S.productos.some(q=>q.id===p.id)) p.id='p'+(S.next++); p.v=true;
      S.productos.unshift(p); if(x.costo!=null&&L.costos[p.id]==null) L.costos[p.id]=x.costo; L.archivo.splice(+id,1); ui.invQ=''; ui.invCat='Todos'; markDirty(); renderPane(); toast('“'+p.n+'” volvió al inventario. Presiona Guardar y publicar.'); break; }
    case 'purge': { if(armed!=='purge'+id){armed='purge'+id;renderPane();break;} armed=null; L.archivo.splice(+id,1); markDirty(); renderPane(); toast('Producto eliminado del backlog. Presiona Guardar y publicar.'); break; }
    case 'imgdel': { const p=P(id); if(p){ delete p.img; markDirty(); $('#invBody').innerHTML=invBodyHTML(); updImgStat(); } break; }
    case 'imgcancel': ui.imgs=null; $('#imgPrev').innerHTML=''; break;
    case 'imgapply': { if(docKB()>MAX_KB){ toast('La página ya está muy pesada. Aplica menos fotos.'); break; } let n=0; (ui.imgs||[]).forEach(x=>{ if(x.uri&&x.pid){ const p=P(x.pid); if(p){ p.img=x.uri; n++; } } }); ui.imgs=null; if(n){ markDirty(); await persist(n+' fotos cargadas y publicadas.'); } render(); break; }
    case 'savepub': await persist('Cambios publicados. La tienda ya muestra los nuevos precios y stock.'); break;
    case 'savecfg': { const c=cfg(); c.activo=$('#cfA').checked; c.min=Math.max(1,num($('#cfM').value)||3); c.pct=clamp(parseFloat(String($('#cfP').value).replace(',','.'))||0,0,100); c.alcance=$('#cfS').value==='todo'?'todo':'linea';
      const w=String($('#cfW').value).replace(/\D/g,''); if(w.length>=8)S.negocio.wa=normTel(w); const lk=($('#cfLink').value||'').trim(); if(/^https?:\/\/\S+$/i.test(lk)) S.negocio.link=lk; else if(lk==='') delete S.negocio.link; S.config.stockBajo=Math.max(0,num($('#cfL').value)||3); await persist('Ajustes publicados.'); break; }
    case 'importok': { const r=applyImport(); ui.import=null; await persist('Inventario actualizado: '+r.up+' productos modificados, '+r.nw+' nuevos.'); break; }
    case 'importcancel': ui.import=null; $('#import').innerHTML=''; break;
    case 'setupledger': { const p1=$('#pw1').value, p2=$('#pw2').value; if(p1.length<6){toast('La clave debe tener al menos 6 caracteres.');break;} if(p1!==p2){toast('Las claves no coinciden.');break;}
      sess=await makeSess(p1); L=emptyLedger(); rememberPw(p1,$('#pwRem').checked); await persist('Libro de ventas creado. ¡Listo para registrar ventas!'); break; }
    case 'unlock': { const p=$('#pwU').value; if(await unlock(p)){ rememberPw(p,$('#pwRem').checked); renderPane(); if(dirty)markDirty(); toast('Libro desbloqueado'); } else toast('Clave incorrecta.'); break; }
    case 'lock': L=null; sess=null; store('s','bl_pw',null); store('l','bl_pw',null); renderPane(); toast('Libro bloqueado'); break;
    case 'changepw': { const o=$('#pwOld').value, n=$('#pwNew').value; if(o!==sess.pass){toast('La clave actual no coincide.');break;} if(n.length<6){toast('La nueva clave debe tener al menos 6 caracteres.');break;}
      sess=await makeSess(n); rememberPw(n,!!store('l','bl_pw')); await persist('Clave cambiada.'); break; }
    case 'dlpublic': download('bubba-la-tienda-publica.html',buildDoc(Object.assign({},S,{libro:null,productos:S.productos.map(p=>Object.assign({},p,{k:null}))}))); break;
    case 'fjadd': L.sim.fijos.push({c:'Nuevo gasto',m:0}); markDirty(); $('#fjList').innerHTML=fijosHTML(); simRefresh(); break;
    case 'fjdel': L.sim.fijos.splice(+id,1); markDirty(); $('#fjList').innerHTML=fijosHTML(); simRefresh(); break;
    case 'simsel': ui.simSel=ui.simSel===id?null:id; simRefresh(); if(ui.simSel){ const d=$('#simDet'); if(d) d.scrollIntoView({block:'nearest',behavior:'smooth'}); } break;
    case 'simapply': { const p=P(id), sg=p&&suggest(p); if(sg&&sg.price){ p.p=sg.price; markDirty(); simRefresh(); toast('Precio actualizado: '+p.n+' → '+money(sg.price)+'. Guarda para publicarlo.'); } break; }
    case 'simlow': { if(armed!=='simlow'){armed='simlow';renderPane();break;} armed=null; let n=0;
      S.productos.forEach(p=>{ const sg=suggest(p), cu=sg&&unitCalc(p,p.p); if(sg&&sg.price&&cu&&cu.margen<L.sim.margenMin/100&&sg.price>p.p){ p.p=sg.price; n++; } });
      if(n)markDirty(); renderPane(); toast(n+' precios corregidos. Guarda para publicarlos.'); break; }
    case 'simall': { if(armed!=='simall'){armed='simall';renderPane();break;} armed=null; let n=0;
      S.productos.forEach(p=>{ const sg=suggest(p); if(sg&&sg.price&&sg.price!==p.p){ p.p=sg.price; n++; } });
      if(n)markDirty(); renderPane(); toast(n+' precios actualizados. Guarda para publicarlos.'); break; }
    case 'simsave': await persist('Supuestos, costos y precios guardados.'); break;
    case 'copylink': copyText(($('#cfLink')&&/^https?:\/\//i.test($('#cfLink').value.trim()))?$('#cfLink').value.trim():shareLink(),'Link copiado. Ya puedes pegarlo en WhatsApp o Instagram.'); break;
    case 'copylinkb': { const base=(($('#cfLink')&&$('#cfLink').value.trim())||shareLink()).split('#')[0]; copyText(base+'#belleza','Link de accesorios y cosmética copiado.'); break; }
    case 'sharestore': shareStore(); break;
    case 'linkclose': ui.linkM=null; renderModal(); break;
    case 'dlbackup': download('respaldo-libro-bubba-la.json',JSON.stringify(L)); break;
  }
  if(['addmov','delmov','abono','anular','savecfg','importok','changepw','setupledger','savepub','simsave'].includes(a)) render();
});
function rememberPw(p,rem){ store('s','bl_pw',p); if(rem)store('l','bl_pw',p); else store('l','bl_pw',null); }
function markDirty(){ dirty=true; const o=$('.obar'); if(o&&ui.view==='panel'){ o.innerHTML='<span><span class="dot"></span>Panel de gestión</span><span class="sp"></span><span>Cambios sin publicar</span><button type="button" data-a="savepub">Guardar y publicar</button>'; } const s=$('[data-a="savepub"].btn-dark'); if(s)s.disabled=false; }

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.sim!=null&&L){ simInput(t); return; }
  if(t.dataset&&t.dataset.fj!=null&&L){ fijoInput(t); return; }
  if(t.id==='simQ'){ ui.simQ=t.value; const b=$('#simBody'); if(b)b.innerHTML=simRowsHTML(); return; }
  if(t.id==='q'){ ui.q=t.value; renderList(); return; }
  if(t.id==='cName'){ meta.name=t.value; saveCart(); renderQuote(); return; }
  if(t.id==='cNotes'){ meta.notes=t.value; saveCart(); renderQuote(); return; }
  if(t.id==='invQ'){ ui.invQ=t.value; $('#invBody').innerHTML=invBodyHTML(); return; }
  if(ui.sale&&t.dataset.f){ ui.sale[t.dataset.f]=t.value; if(t.type!=='radio'&&t.tagName!=='SELECT'){ const s=$('#saleTot'); if(s)s.innerHTML=saleTotHTML(); } return; }
  const tr=t.closest&&t.closest('tr[data-pid]');
  if(tr&&t.dataset.k&&t.type!=='checkbox'&&t.tagName!=='SELECT'){ editProd(tr.dataset.pid,t.dataset.k,t.value); }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.imgfor&&t.files[0]){ await setImage(t.dataset.imgfor,t.files[0]); t.value=''; return; }
  if(t.dataset&&t.dataset.imgmap!=null&&ui.imgs){ ui.imgs[+t.dataset.imgmap].pid=t.value; const b=$('[data-a="imgapply"]'); const ok=ui.imgs.filter(x=>x.uri&&x.pid).length; if(b){ b.disabled=!ok; b.textContent='Aplicar '+ok+' fotos y publicar'; } return; }
  if(t.id==='imgs'&&t.files.length){ const items=Array.from(t.files).filter(f=>/^image\//.test(f.type)||IMG_EXT.test(f.name)).map(f=>({name:f.name,blob:f})); t.value=''; if(!items.length){ toast('No encontré imágenes en tu selección.'); return; } await prepareImages(items); return; }
  if(t.id==='imgzip'&&t.files[0]){ const f=t.files[0]; t.value=''; try{ const items=await zipImages(f); if(!items.length){ toast('El ZIP no tiene imágenes (JPG, PNG o WebP).'); return; } await prepareImages(items); }catch(err){ toast('No pude abrir ese ZIP. Descárgalo de nuevo o sube las fotos sueltas.'); } return; }
  if(t.id==='pm_img'&&t.files[0]){ try{ ui.prodM.img=await processImage(t.files[0]); const pv=$('#pmPrev'); if(pv) pv.innerHTML='<img src="'+esc(ui.prodM.img)+'" alt="Vista previa">'; }catch(err){ toast('No pude leer esa imagen. Usa JPG, PNG o WebP.'); } return; }
  if(t.id==='invCat'){ ui.invCat=t.value; $('#invBody').innerHTML=invBodyHTML(); return; }
  if(t.id==='simCat'){ ui.simCat=t.value; const b=$('#simBody'); if(b)b.innerHTML=simRowsHTML(); return; }
  if(t.dataset&&t.dataset.cost&&L){ setCost(t.dataset.cost,t.value); markDirty(); simRefresh(); return; }
  if(ui.sale&&t.dataset.f){ ui.sale[t.dataset.f]=t.type==='radio'?t.value:t.value; if(t.type==='radio'||t.tagName==='SELECT'){ if(t.dataset.f==='mode'){ const c=$('#sCustom'); if(c)c.hidden=ui.sale.mode!=='custom'; } if(t.dataset.f==='medio'){ const pd=$('#sPaid'); if(pd)pd.placeholder=ui.sale.medio==='Fiado'?'0':'Total'; } const s=$('#saleTot'); if(s)s.innerHTML=saleTotHTML(); } return; }
  const tr=t.closest&&t.closest('tr[data-pid]');
  if(tr&&t.dataset.k){ editProd(tr.dataset.pid,t.dataset.k,t.type==='checkbox'?t.checked:t.value); if(t.dataset.k==='c') $('#invBody').innerHTML=invBodyHTML(); return; }
  if(ui.import&&t.dataset.f){ const im=ui.import; if(t.dataset.f==='imode')im.mode=t.value; if(t.dataset.f==='icreate')im.create=t.checked; if(t.dataset.f==='idef')im.defCat=t.value; $('#import').innerHTML=importHTML(); return; }
  if(t.id==='file'&&t.files[0]){
    const f=t.files[0];
    try{ const rows=await readFile(f); const items=interpret(rows);
      if(!items.length){ toast('No encontré productos en el archivo. Revisa que tenga nombre y precio.'); return; }
      ui.import={name:f.name,items,mode:'replace',create:false,defCat:''}; $('#import').innerHTML=importHTML(); $('#import').scrollIntoView({block:'nearest'});
    }catch(err){ toast('No pude leer el archivo. Prueba guardándolo como CSV.'); }
    t.value=''; return;
  }
  if(t.id==='bk'&&t.files[0]){
    try{ const o=JSON.parse(await t.files[0].text()); if(!o||!Array.isArray(o.ventas)||!Array.isArray(o.movs)) throw 0; L=normLedger(o); await persist('Respaldo restaurado.'); }catch(err){ toast('El archivo no es un respaldo válido.'); }
    t.value='';
  }
});
function editProd(id,k,val){
  const p=P(id); if(!p)return;
  if(k==='n')p.n=String(val).slice(0,120);
  else if(k==='c')p.c=val;
  else if(k==='p')p.p=Math.max(0,num(val)||0);
  else if(k==='k'){ if(!L)return; setCost(id,val); }
  else if(k==='s')p.s=String(val).trim()===''?null:Math.max(0,num(val)||0);
  else if(k==='m')p.m=String(val).trim()===''?null:Math.max(0,num(val)||0);
  else if(k==='d')p.d=!!val;
  else if(k==='wm')p.wm=val==='fijo'?'fijo':'descuento';
  else if(k==='pm')p.pm=String(val).trim()===''?null:Math.max(0,num(val)||0);
  else if(k==='v')p.v=!!val;
  markDirty(); const s=$('#invSum'); if(s)s.innerHTML=invSummaryHTML();
}
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* =====================  arranque  ===================== */
async function init(){
  loadCart();
  const qs=new URLSearchParams(location.search), h=(location.hash||'').replace('#','');
  const v=qs.get('vista')||h||store('s','bl_view')||'tienda';
  ui.view=['tienda','belleza','panel'].includes(v)?v:'tienda';
  const tb=store('s','bl_tab'); if(tb&&['resumen','ventas','caja','cobrar','inventario','simulador','ajustes'].includes(tb)) ui.tab=tb;
  document.body.insertAdjacentHTML('beforeend','<div id="mbar" class="mbar"><div><strong id="mTotal">$0</strong><span id="mCount">0 productos</span></div><button type="button" data-a="goq">Ver cotización</button></div><div id="modal"></div><div id="toast" class="toast" role="status"></div>');
  $('#root').outerHTML='<div id="app"></div>';
  render();
  const t=store('s','bl_toast'); if(t){ store('s','bl_toast',null); toast(t); }
  // capacidades de la plataforma (llegan después del primer pintado)
  if(window.claude&&window.claude.use){
    try{
      const [u,ar,dl]=await Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('downloads')]);
      api.artifact=ar; api.downloads=dl;
      owner=!!(u&&((await u.canEdit())||(await u.isOwner())));
    }catch(e){ owner=false; }
  }
  if(owner){
    const pw=store('s','bl_pw')||store('l','bl_pw');
    if(S.libro&&pw){ if(await unlock(pw)){ store('s','bl_pw',pw); } else { store('s','bl_pw',null); store('l','bl_pw',null); } }
    render();
  } else if(ui.view==='panel'){ ui.view='tienda'; render(); }
}
init();
})();
</script>
